name: DevSecOps Pipeline

on: [push]

jobs:
  # build:
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Checkout 
  #       uses: actions/checkout@v3

  #     - name: Build
  #       run: docker build -t app:latest .
  
  security:
    # needs: build
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: docker build -t app:latest .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: 'app:latest'
          format: 'json'
          output: 'tools/generate_report/trivy.json'
        
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy_report
          path: tools/generate_report/trivy.json
      

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # - name: Run Semgrep 
      #   uses: returntocorp/semgrep-action@v1

      - name: Detect changes in app/
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'app/**'

      
      - name: Run SonarQube Scan
        if: steps.changes.output.src == 'true'
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Get Sonar issues
        run: |
          curl -u ${{ secrets.SONAR_TOKEN }}: \
          "https://sonarcloud.io/api/issues/search?componentKeys=Advil400mg_devsecops" \
          -o tools/generate_report/sonar-report.json

      - name: Generate PDF report
        run: python tools/generate_report/generate.py

      - name: Upload Sonar report
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: tools/generate_report/report.pdf

      - name: Send email
        uses: devellany/send-mail@v1.0.2
        with:
          host: smtp.gmail.com
          # Optional port (defaults to 465)
          port: 465
          account: ${{secrets.ACCOUNT}}
          password: ${{secrets.MAIL_PASSWORD}}
          sender: devellany
          from: ${{secrets.ACCOUNT}}
          to: ${{secrets.ACCOUNT}}
          subject: Sonarqube results
          body: Find attached the pdf report from sonarqube;
          # Optional content type (defaults to text/plain)
          contentType: text/plain
          # Optional attachment files (JSON type. require property 'path')
          attachments: '[{"path":"tools/generate_report/report.pdf"}]'

      # - name: Upload Sonar report
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: sonar-report
      #     path: sonar-report.json

    

